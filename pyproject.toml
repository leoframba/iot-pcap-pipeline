[project]
name = "iot-pcap-pipeline"
version = "1.0.0"
description = "End-to-end IoMT intrusion detection: raw PCAPs to frozen HGB window scores, served as PCAP-level BENIGN/ATTACK via FastAPI on Vertex AI."
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "leoframba", email = "89568350+leoframba@users.noreply.github.com" }
]
keywords = [
    "cybersecurity",
    "machine-learning",
    "intrusion-detection",
    "iomt",
    "pcap",
    "fastapi",
    "docker",
    "vertex-ai",
    "gcp",
]
requires-python = ">=3.11"
# Minimal runtime shared by local classify + container serving.
# Pin scikit-learn to the exact version that produced artifacts/v1/H0_full_fit.joblib.
dependencies = [
    "dpkt>=1.9.8",
    "joblib>=1.5.3",
    "numpy>=2.0.0",
    "scikit-learn==1.9.0",
]

[project.urls]
Homepage = "https://github.com/leoframba/iot-pcap-pipeline"
Repository = "https://github.com/leoframba/iot-pcap-pipeline"
Issues = "https://github.com/leoframba/iot-pcap-pipeline/issues"

[project.scripts]
iot-pcap-pipeline = "iot_pcap_pipeline.cli:main"

[project.optional-dependencies]
# Container / API runtime: uv sync --extra serving
serving = [
    "fastapi",
    "uvicorn",
    "google-cloud-storage",
]
# Research / offline training & evaluation: uv sync --extra research
research = [
    "catboost>=1.2.10",
    "matplotlib>=3.11.1",
    "pandas>=3.0.5",
    "pyarrow>=25.0.0",
    "seaborn>=0.13.2",
    "xgboost>=3.2.0",
]

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "pytest>=9.1.1",
    "ruff>=0.16.2",
]

[tool.pytest.ini_options]
markers = [
    "corpus: requires local CICIoMT raw PCAPs under data/raw/WiFI_and_MQTT/",
]

[tool.ruff]
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
# V1 freeze: CI lint is a syntax / undefined-name gate, not a style rewrite.
select = ["E9", "F63", "F7", "F82"]
