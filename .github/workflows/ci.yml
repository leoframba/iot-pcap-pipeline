name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          python-version: "3.11"

      - name: Sync locked dependencies
        # Full research + serving + dev so unit tests and CLI smoke can import
        # Parquet / modeling paths. Docker installs only: uv sync --extra serving
        run: uv sync --locked --extra serving --extra research

      - name: Verify frozen V1 model SHA-256
        run: |
          uv run python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path(".")
          model = root / "artifacts/v1/H0_full_fit.joblib"
          pkg_path = root / "artifacts/v1/v1_model_package.json"
          contract_path = root / "artifacts/v1/serving_contract.json"
          if not model.is_file():
              raise SystemExit(f"missing model artifact: {model}")
          if not pkg_path.is_file():
              raise SystemExit(f"missing package json: {pkg_path}")
          if not contract_path.is_file():
              raise SystemExit(f"missing serving contract: {contract_path}")

          digest = hashlib.sha256(model.read_bytes()).hexdigest()
          pkg = json.loads(pkg_path.read_text())
          contract = json.loads(contract_path.read_text())
          expected = pkg["model_artifact_sha256"]
          if digest != expected:
              raise SystemExit(
                  f"model SHA mismatch vs v1_model_package:\n  got:      {digest}\n  expected: {expected}"
              )
          serving_sha = contract["model"]["model_artifact_sha256"]
          if digest != serving_sha:
              raise SystemExit(
                  f"model SHA mismatch vs serving_contract:\n  got:      {digest}\n  expected: {serving_sha}"
              )
          if contract.get("status") != "frozen":
              raise SystemExit(f"serving_contract status={contract.get('status')!r}")
          pcap = contract["pcap_decision"]
          assert pcap["pcap_min_attack_windows"] == 3
          assert pcap["pcap_attack_rate_threshold"] == 0.005
          assert pcap["minimum_complete_windows"] == 3
          print(f"ok artifacts/v1/H0_full_fit.joblib == {digest}")
          print("ok serving_contract.json frozen K=3 R=0.005 min_windows=3")
          PY

      - name: Verify serving contract module
        run: uv run python -c "from iot_pcap_pipeline.serving.contract import verify_serving_contract; verify_serving_contract(); print('ok')"

      - name: Ruff (syntax / undefined names)
        run: uv run ruff check src tests scripts

      - name: Unit / synthetic tests (exclude corpus)
        run: uv run pytest -m "not corpus" -q --tb=short

      - name: CLI / package smoke test
        run: uv run iot-pcap-pipeline --help

  docker-smoke:
    name: Docker image smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          python-version: "3.11"

      - name: Sync host deps for direct classify parity
        run: uv sync --locked --extra serving

      - name: Build serving image
        id: build
        run: |
          GIT_SHA="$(git rev-parse HEAD)"
          IMAGE_TAG="iomt-ids:v1-${GIT_SHA}"
          echo "IMAGE_TAG=${IMAGE_TAG}" >> "$GITHUB_ENV"
          echo "tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          docker build --platform=linux/amd64 -t "${IMAGE_TAG}" .
          docker image inspect "${IMAGE_TAG}" --format '{{.Id}} {{.Size}} {{.Architecture}}'

      - name: Run Docker smoke (local fetcher, no GCP)
        run: |
          export IMAGE_TAG
          export HOST_PORT=18080
          export REPO_ROOT="${PWD}"
          uv run python scripts/docker_smoke.py

      - name: Upload d3 CI run record
        uses: actions/upload-artifact@v4
        with:
          name: d3-ci-run
          path: data/serving/v1/d3_ci_run.json
