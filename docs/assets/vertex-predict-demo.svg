<svg xmlns="http://www.w3.org/2000/svg" width="920" height="560" viewBox="0 0 920 560" role="img" aria-labelledby="title desc">
  <title id="title">Sanitized Vertex AI rawPredict success</title>
  <desc id="desc">Terminal screenshot of a successful Vertex rawPredict call returning PCAP-level ATTACK. Project numbers and tokens are redacted.</desc>
  <rect width="920" height="560" rx="12" fill="#1e1e1e"/>
  <circle cx="28" cy="22" r="7" fill="#ff5f56"/>
  <circle cx="50" cy="22" r="7" fill="#ffbd2e"/>
  <circle cx="72" cy="22" r="7" fill="#27c93f"/>
  <text x="110" y="27" fill="#9cdcfe" font-family="Menlo, Monaco, Consolas, monospace" font-size="13">vertex_smoke.py - us-west1 rawPredict</text>
  <text x="24" y="64" fill="#6a9955" font-family="Menlo, Monaco, Consolas, monospace" font-size="13"># ADC only - no service-account key in the repo</text>
  <text x="24" y="88" fill="#dcdcaa" font-family="Menlo, Monaco, Consolas, monospace" font-size="13">$ uv run python scripts/vertex_smoke.py</text>
  <text x="24" y="120" fill="#808080" font-family="Menlo, Monaco, Consolas, monospace" font-size="13">POST .../endpoints/&lt;ENDPOINT_ID&gt;:rawPredict</text>
  <text x="24" y="144" fill="#ce9178" font-family="Menlo, Monaco, Consolas, monospace" font-size="13">{&quot;instances&quot;:[{&quot;gcs_uri&quot;:&quot;gs://iomt-pcap-input-&lt;PROJECT_NUMBER&gt;/pcaps/vertex-smoke.pcap&quot;}]}</text>
  <text x="24" y="176" fill="#4ec9b0" font-family="Menlo, Monaco, Consolas, monospace" font-size="13">HTTP 200</text>
  <text x="24" y="208" fill="#d4d4d4" font-family="Menlo, Monaco, Consolas, monospace" font-size="13">{</text>
  <text x="40" y="232" fill="#d4d4d4" font-family="Menlo, Monaco, Consolas, monospace" font-size="13">&quot;ok&quot;: true,</text>
  <text x="40" y="256" fill="#d4d4d4" font-family="Menlo, Monaco, Consolas, monospace" font-size="13">&quot;status&quot;: &quot;OK&quot;,</text>
  <text x="40" y="280" fill="#d4d4d4" font-family="Menlo, Monaco, Consolas, monospace" font-size="13">&quot;prediction&quot;: &quot;ATTACK&quot;,</text>
  <text x="40" y="304" fill="#d4d4d4" font-family="Menlo, Monaco, Consolas, monospace" font-size="13">&quot;pcap_attack_score&quot;: 1.0,</text>
  <text x="40" y="328" fill="#d4d4d4" font-family="Menlo, Monaco, Consolas, monospace" font-size="13">&quot;window_summary&quot;: {&quot;total_windows&quot;: 3, &quot;attack_windows&quot;: 3, &quot;benign_windows&quot;: 0},</text>
  <text x="40" y="352" fill="#d4d4d4" font-family="Menlo, Monaco, Consolas, monospace" font-size="13">&quot;model&quot;: {</text>
  <text x="56" y="376" fill="#d4d4d4" font-family="Menlo, Monaco, Consolas, monospace" font-size="13">&quot;model_version&quot;: &quot;v1_hgb22_nontemporal&quot;,</text>
  <text x="56" y="400" fill="#d4d4d4" font-family="Menlo, Monaco, Consolas, monospace" font-size="13">&quot;serving_contract_version&quot;: &quot;v1&quot;,</text>
  <text x="56" y="424" fill="#d4d4d4" font-family="Menlo, Monaco, Consolas, monospace" font-size="13">&quot;score_semantics&quot;: &quot;uncalibrated_model_score&quot;</text>
  <text x="40" y="448" fill="#d4d4d4" font-family="Menlo, Monaco, Consolas, monospace" font-size="13">},</text>
  <text x="40" y="472" fill="#d4d4d4" font-family="Menlo, Monaco, Consolas, monospace" font-size="13">&quot;cloud_vs_local_parity&quot;: &quot;passed&quot;</text>
  <text x="24" y="496" fill="#d4d4d4" font-family="Menlo, Monaco, Consolas, monospace" font-size="13">}</text>
  <text x="24" y="532" fill="#6a9955" font-family="Menlo, Monaco, Consolas, monospace" font-size="13"># Endpoint may be undeployed after validation. Digest + this record are the proof.</text>
</svg>
