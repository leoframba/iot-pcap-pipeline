[project]
name = "iot-pcap-pipeline"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "leoframba", email = "89568350+leoframba@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "catboost>=1.2.10",
    "dpkt>=1.9.8",
    "joblib>=1.5.3",
    "matplotlib>=3.11.1",
    "pandas>=3.0.5",
    "pyarrow>=25.0.0",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
    "xgboost>=3.2.0",
]

[project.scripts]
iot-pcap-pipeline = "iot_pcap_pipeline:main"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "pytest>=9.1.1",
    "ruff>=0.16.2",
]
